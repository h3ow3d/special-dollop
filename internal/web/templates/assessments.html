<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Assessments</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50">
    <main class="max-w-5xl mx-auto p-8 space-y-6">
      <h1 class="text-2xl font-semibold">Suitability Assessments</h1>
      <form method="post" action="/assessments" class="grid grid-cols-2 gap-3 bg-white p-4 rounded border">
        <input type="hidden" name="gorilla.csrf.Token" value="{{ .csrf }}" />
        <input name="assessment_id" placeholder="Assessment ID (optional)" class="border p-2 rounded" />
        <input name="review_date" type="date" class="border p-2 rounded" />
        <input name="artefact_name" placeholder="Artefact Name" class="border p-2 rounded" required />
        <input name="artefact_type" placeholder="Artefact Type" class="border p-2 rounded" required />
        <input name="artefact_digest" placeholder="sha256:..." class="border p-2 rounded" required />
        <input name="artefact_registry" placeholder="registry" class="border p-2 rounded" required />
        <input name="repository_url" placeholder="Repository URL" class="border p-2 rounded col-span-2" required />
        <button class="bg-blue-600 text-white px-4 py-2 rounded col-span-2">Create Assessment</button>
      </form>
      <ul class="space-y-2">
        {{ range .items }}
        <li class="bg-white border rounded p-4"><a class="text-blue-700" href="/assessments/{{ .ID }}">{{ .AssessmentID }}</a> — {{ .Status }} — {{ .ArtefactName }}</li>
        {{ else }}
        <li class="text-sm text-slate-600">No assessments found.</li>
        {{ end }}
      </ul>
    </main>
  </body>
</html>
