<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Assessment</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50">
    <main class="max-w-5xl mx-auto p-8 space-y-6">
      <a href="/assessments" class="text-blue-700">← Back</a>
      <h1 class="text-2xl font-semibold">{{ .assessment.AssessmentID }}</h1>
      <p>Status: <strong>{{ .assessment.Status }}</strong></p>
      <section class="grid grid-cols-2 gap-6">
        <form method="post" action="/assessments/{{ .assessment.ID }}/outcome" class="bg-white border rounded p-4 space-y-2">
          <input type="hidden" name="gorilla.csrf.Token" value="{{ .csrf }}" />
          <h2 class="font-medium">Outcome Selection</h2>
          <select name="outcome" class="border p-2 rounded w-full">
            <option>OutcomeA</option><option>OutcomeB</option><option>OutcomeC</option><option>OutcomeD</option>
          </select>
          <select name="pattern" class="border p-2 rounded w-full">
            <option>PatternA</option><option>PatternB</option><option>PatternC</option><option>PatternD</option>
          </select>
          <textarea name="rationale" placeholder="Rationale" class="border p-2 rounded w-full"></textarea>
          <textarea name="controls" placeholder="Required controls" class="border p-2 rounded w-full"></textarea>
          <textarea name="pattern_rationale" placeholder="Pattern rationale" class="border p-2 rounded w-full"></textarea>
          <button class="bg-blue-600 text-white px-4 py-2 rounded">Save Outcome</button>
        </form>
        <div class="space-y-3">
          <form method="post" action="/assessments/{{ .assessment.ID }}/approve" class="bg-white border rounded p-4 space-y-2">
            <input type="hidden" name="gorilla.csrf.Token" value="{{ .csrf }}" />
            <h2 class="font-medium">Approval</h2>
            <textarea name="comments" placeholder="Approval comments" class="border p-2 rounded w-full"></textarea>
            <button class="bg-emerald-600 text-white px-4 py-2 rounded">Approve Assessment</button>
          </form>
          <form method="post" action="/assessments/{{ .assessment.ID }}/attest" class="bg-white border rounded p-4">
            <input type="hidden" name="gorilla.csrf.Token" value="{{ .csrf }}" />
            <button class="bg-purple-600 text-white px-4 py-2 rounded">Generate + Sign Attestation</button>
          </form>
          <form method="post" action="/assessments/{{ .assessment.ID }}/publish" class="bg-white border rounded p-4 space-y-2">
            <input type="hidden" name="gorilla.csrf.Token" value="{{ .csrf }}" />
            <input name="registry" class="border p-2 rounded w-full" placeholder="registry host" required />
            <input name="artifact_ref" class="border p-2 rounded w-full" placeholder="repository@sha256:..." required />
            <button class="bg-slate-800 text-white px-4 py-2 rounded">Publish to OCI</button>
          </form>
        </div>
      </section>
      <div class="space-x-2">
        <a class="underline" href="/reports/{{ .assessment.ID }}.html">HTML Report</a>
        <a class="underline" href="/reports/{{ .assessment.ID }}.json">JSON Report</a>
      </div>
    </main>
  </body>
</html>
