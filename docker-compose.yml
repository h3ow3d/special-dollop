services:
  clph-web:
    build: .
    container_name: clph-web
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      HTTP_ADDR: :8080
      CSRF_AUTH_KEY: ${CSRF_AUTH_KEY}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: clph-postgres
    environment:
      POSTGRES_DB: clph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clph"]
      interval: 5s
      timeout: 5s
      retries: 20

  registry:
    image: registry:2
    container_name: clph-registry
    ports:
      - "5000:5000"
