services:
  postgres:
    image: postgres:16-alpine
    container_name: cdscam-postgres
    environment:
      POSTGRES_DB: cdscam
      POSTGRES_USER: cdscam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdscam_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdscam"]
      interval: 5s
      timeout: 5s
      retries: 10

  clph-web:
    build: .
    container_name: clph-web
    env_file: .env
    environment:
      HTTP_ADDR: :8080
      CSRF_AUTH_KEY: ${CSRF_AUTH_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-http://localhost:8080/auth/callback}
      DATABASE_URL: postgres://cdscam:${POSTGRES_PASSWORD:-cdscam_dev}@postgres:5432/cdscam?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
