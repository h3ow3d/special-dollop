services:
  clph-web:
    build: .
    container_name: clph-web
    env_file: .env
    environment:
      HTTP_ADDR: :8080
      CSRF_AUTH_KEY: ${CSRF_AUTH_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-http://localhost:8080/auth/callback}
    ports:
      - "8080:8080"
    depends_on:
      - registry

  registry:
    image: registry:2
    container_name: clph-registry
    ports:
      - "5000:5000"
